services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=django_user
      - POSTGRES_PASSWORD=mi_contrasena_secreta
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=desarrollo_secret_key_123
      - DB_NAME=django_db
      - DB_USER=django_user
      - DB_PASSWORD=mi_contrasena_secreta
      - DB_HOST=db
      - DB_PORT=5432
      - RUT_HASH_PEPPER=dev-pepper-local
      # Envío real de correo: completa estas 2 variables para activarlo
      # (si EMAIL_HOST_USER queda vacío, las contraseñas solo se imprimen
      # en los logs de "docker compose logs web", modo desarrollo).
      # Gmail: usa una "contraseña de aplicación", no tu contraseña normal
      # -> https://myaccount.google.com/apppasswords (requiere verificación en 2 pasos)
      - EMAIL_HOST_USER=
      - EMAIL_HOST_PASSWORD=
      - DEFAULT_FROM_EMAIL=no-responder@agingwomen.local
    depends_on:
      - db

volumes:
  postgres_data:
