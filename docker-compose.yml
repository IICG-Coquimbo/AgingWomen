services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=django_user
      - POSTGRES_PASSWORD=mi_contrasena_secreta
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=desarrollo_secret_key_123
      - DB_NAME=django_db
      - DB_USER=django_user
      - DB_PASSWORD=mi_contrasena_secreta
      - DB_HOST=db
      - DB_PORT=5432
      - RUT_HASH_PEPPER=dev-pepper-local
      # Envío real de correo: los valores se leen del archivo ".env" (no se
      # sube a GitHub). Copia ".env.example" como ".env" y complétalo. Si
      # quedan vacíos, los correos solo se imprimen en "docker compose logs web".
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
    depends_on:
      - db

volumes:
  postgres_data:
