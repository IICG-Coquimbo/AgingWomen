services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    # Secretos de desarrollo (Fase 40S-1): se leen del archivo privado
    # .env.desarrollo, que NO se sube a GitHub. Créalo a partir de .env.example.
    env_file:
      - .env.desarrollo
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=django_user
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src:/app
    ports:
      - "8000:8000"
    # Secretos de desarrollo (Fase 40S-1): se leen del archivo privado
    # .env.desarrollo, que NO se sube a GitHub. Créalo a partir de .env.example.
    env_file:
      - .env.desarrollo
    environment:
      - DEBUG=1
      - DB_NAME=django_db
      - DB_USER=django_user
      - DB_HOST=db
      - DB_PORT=5432
      # Envío real de correo: los valores se leen del archivo ".env" (no se
      # sube a GitHub). Copia ".env.example" como ".env" y complétalo. Si
      # quedan vacíos, los correos solo se imprimen en "docker compose logs web".
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
    depends_on:
      - db

volumes:
  postgres_data:
